services:
  - type: web
    name: pylon-dummy
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # seed.py is idempotent: it creates the tables and the demo data only if they're missing.
    startCommand: python seed.py && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.5
      - key: DATABASE_URL
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
